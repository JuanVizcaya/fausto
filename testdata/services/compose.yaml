name: core-services

# Compose services kept by their owning agent.
#include:
#  - deploy/compose/administrators.yaml

# Settings shared by every Go service.
x-go-service: &go-service
  read_only: true
  tmpfs:
    - /tmp:size=64m,uid=65532,gid=65532,mode=0700
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 256M
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 15s
  healthcheck:
    test: ["CMD", "/service", "healthcheck"]
    interval: 10s
    timeout: 5s
    start_period: 5s
    retries: 3

services:
  # =========================================================================
  # PostgreSQL Database (v17 / v18 supported by Keycloak 26+)
  # =========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =========================================================================
  # Keycloak IAM Server (Latest Stable 26.x)
  # =========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak-server
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_db_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "9000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # =========================================================================
  # API gateway: HTTP/JSON for the browser, gRPC to domain services
  # =========================================================================
  api:
    <<: *go-service
    build:
      context: ./backend
      args:
        SERVICE: api
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    expose:
      - "9090"
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      SHUTDOWN_TIMEOUT: "10s" # keep below stop_grace_period
      RESIDENTS_ADDR: "dns:///residents:9090"
    depends_on:
      residents:
        condition: service_healthy

  residents:
    <<: *go-service
    build:
      context: ./backend
      args:
        SERVICE: residents
    # Internal only: gRPC on 9090 for other services; HTTP 8080 serves probes.
    expose:
      - "9090"
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      SHUTDOWN_TIMEOUT: "10s"
      DATABASE_URL: "postgres://residents:${RESIDENTS_DB_PASSWORD:-residents}@residents-db:5432/residents?sslmode=disable&pool_max_conns=10"
    depends_on:
      residents-db:
        condition: service_healthy

  # Each service owns its database; only residents connects to this one.
  residents-db:
    image: postgres:18
    environment:
      POSTGRES_DB: residents
      POSTGRES_USER: residents
      POSTGRES_PASSWORD: ${RESIDENTS_DB_PASSWORD:-residents}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - residents-db:/var/lib/postgresql
      - ./deploy/postgres/residents-init.sql:/docker-entrypoint-initdb.d/residents-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residents -d residents"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # Fausto, for reviewing and proposing changes to system/, run against
  # this clone. Start it with:
  #   docker compose --profile fausto up --build fausto
  # Set FAUSTO_AUTHOR in .env so proposal commits carry your name.
  fausto:
    profiles: ["fausto"]
    build:
      context: ./fausto
    ports:
      - "127.0.0.1:${FAUSTO_PORT:-7070}:7070"
    environment:
      FAUSTO_AUTHOR: ${FAUSTO_AUTHOR:-}
      FAUSTO_BASE: ${FAUSTO_BASE:-}
      FAUSTO_JIRA_URL: ${FAUSTO_JIRA_URL:-}
      FAUSTO_JIRA_EMAIL: ${FAUSTO_JIRA_EMAIL:-}
      FAUSTO_JIRA_TOKEN: ${FAUSTO_JIRA_TOKEN:-}
      FAUSTO_JIRA_PROJECT: ${FAUSTO_JIRA_PROJECT:-}
      FAUSTO_JIRA_ISSUE_TYPE: ${FAUSTO_JIRA_ISSUE_TYPE:-}
      FAUSTO_JIRA_STATUSES: ${FAUSTO_JIRA_STATUSES:-}
      # Proposals and tasks live in MongoDB (fausto/compose.yaml runs one on
      # the host). Inside this container the host is host.docker.internal,
      # not localhost; set FAUSTO_CONTAINER_MONGO_URI for a shared database
      # elsewhere.
      FAUSTO_MONGO_URI: ${FAUSTO_CONTAINER_MONGO_URI:-mongodb://fausto:${FAUSTO_MONGO_PASSWORD:-}@host.docker.internal:${FAUSTO_MONGO_PORT:-27017}/?authSource=admin}
      FAUSTO_MONGO_DB: ${FAUSTO_MONGO_DB:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Files fausto writes (accepted proposals' commits) belong to you.
    user: "${FAUSTO_UID:-1000}:${FAUSTO_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/repo

  # Runs the Go tests, including Postgres integration tests:
  #   docker compose --profile test run --rm --build test
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: development
    command: ["sh", "-c", "go vet ./... && go test -race -count=1 ./..."]
    environment:
      TEST_DATABASE_URL: "postgres://residents:${RESIDENTS_DB_PASSWORD:-residents}@residents-db:5432/residents_test?sslmode=disable"
    volumes:
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      residents-db:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  residents-db:
  go-mod:
  go-build:
  postgres_data:
    driver: local