# Milestones in roadmap order, from the architecture design. A milestone is
# done when every exit criterion is met and its components are no longer
# planned. After M1, M2, M3, M5 and M6 can run in parallel.
milestones:
  - id: m0-foundations
    title: M0 Foundations
    goal: Every product can be built on a working platform, sign-in, and recoverable data.
    status: in-progress
    components: [habbyte, api, platform, caddy, keycloak, postgres, iam, files, audit]
    decisions: ["0001", "0007"]
    exit_criteria:
      - text: The backend is a modular monolith with 14 registered modules and a boundary test
        done: true
      - text: Caddy in front of the backend and Keycloak
        done: true
      - text: Per-module schemas and roles, row-level security, the outbox and River in the platform
      - text: A user signs in with Google in the browser and in both native shells
      - text: A test event reaches audit
      - text: A restore drill passes
      - text: Terraform, staging and production hosts, and CI/CD

  - id: m1-onboarding
    title: M1 Onboarding and governance
    goal: A new development goes live without touching the database, and the governance rules hold against the admin.
    status: planned
    depends_on: [m0-foundations]
    components: [developments, iam, control]
    exit_criteria:
      - text: Development profile, structure, units, CSV import, occupancy, committee and admin assignment
      - text: Invitations, roles and grants, with grants derived from occupancy and governance
      - text: Organizations and plans in control

  - id: m2-finance
    title: M2 Finance core
    goal: Residents are charged and their payments reconciled with manual evidence.
    status: planned
    depends_on: [m1-onboarding]
    components: [finance, notifications]
    exit_criteria:
      - text: Concepts, fee schedules, charges, the ledger and statements
      - text: Payment evidence and reconciliation, delinquency and reminders
      - text: The PRD's finance and payments criteria pass with manual evidence

  - id: m3-access
    title: M3 Physical access
    goal: Ending an occupancy revokes access on real hardware within 5 minutes.
    status: planned
    depends_on: [m1-onboarding]
    components: [accesscontrol, devices]
    exit_criteria:
      - text: The first vendor adapter, with a vendor spike started during M0
      - text: Consent records and remote opening
      - text: Ending an occupancy revokes access on real hardware within 5 minutes

  - id: m4-payments
    title: M4 Online payments and CFDI
    goal: A sandbox payment reaches the ledger and a stamped CFDI reaches the payer.
    status: planned
    depends_on: [m2-finance]
    components: [payments, invoicing]
    exit_criteria:
      - text: Mercado Pago account connection, checkout and webhooks
      - text: Invoicing with the chosen PAC

  - id: m5-community
    title: M5 Community and amenities
    goal: The PRD's criteria for announcements, documents and amenities pass.
    status: planned
    depends_on: [m1-onboarding]
    components: [community, amenities]

  - id: m6-operations
    title: M6 Operations
    goal: A task goes from creation to closure as in the PRD's Servicios criterion.
    status: planned
    depends_on: [m1-onboarding]
    components: [operations]
    exit_criteria:
      - text: Tasks, recurrence, evidence, validation and guest links

  - id: m7-pilot
    title: M7 Pilot readiness
    goal: Every PRD acceptance criterion passes in staging, and the pilot starts.
    status: planned
    depends_on: [m2-finance, m3-access, m4-payments, m5-community, m6-operations]
    components: [control, web]
    exit_criteria:
      - text: Control support and break-glass access, and usage metrics
      - text: A security review and a load test at twice the expected peak
      - text: Runbooks
