id: administrators
name: Administrators agent
kind: agent
scope: Administrators domain service, its gRPC contract, and its database.
owns:
  - backend/cmd/administrators/
  - backend/internal/administrators/
  - backend/gen/habbyte/administrators/
  - proto/habbyte/administrators/
  - deploy/compose/administrators.yaml
  - deploy/postgres/administrators-init.sql
rules:
  - Add schema changes as new numbered migrations; never edit an applied one.
  - Regenerate backend/gen with every proto change.
  - Keep the administrators and administrators-db compose services in deploy/compose/administrators.yaml, which compose.yaml includes; paths there are relative to that file. They must meet the runtime requirements in system/requirements.yaml, as the residents services in compose.yaml do.
