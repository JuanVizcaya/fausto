# Risk register. Severity is likelihood × impact (low 1, medium 2, high 3);
# risks of severity 6 or more need a mitigation unless closed.
risks:
  - id: scope-too-large
    title: The MVP scope is too large for the team
    description: Seven products plus physical access, online payments and CFDI is a lot for three people, even with agents, and the pilot could slip.
    category: delivery
    likelihood: high
    impact: medium
    status: open
    owner: orchestrator
    mitigation: Run parallel tracks after M1, and pilot with manual payment evidence before online payments if needed.
    milestones: [m7-pilot]

  - id: access-vendors-vary
    title: Physical access vendors vary widely
    description: Vendor APIs differ, and some offer only on-site controllers, so M3 could slip and integrations be fragile.
    category: technical
    likelihood: high
    impact: medium
    status: open
    owner: access
    mitigation: Pick one or two vendors for the pilot, run a spike during M0, and design the devices port with an on-site agent as a fallback.
    components: [devices, accesscontrol]
    milestones: [m3-access]

  - id: single-host
    title: The single host fails
    description: Everything runs on one instance, so losing it is a full outage until recovery.
    category: operational
    likelihood: low
    impact: high
    status: accepted
    owner: platform
    mitigation: EC2 auto-recovery, and a rebuild from Terraform and backups within 4 hours. Move to managed, redundant hosting once customers pay.
    components: [habbyte, postgres, keycloak]
    requirements: [availability, backups]

  - id: postgres-data-loss
    title: Postgres in a container loses data
    description: The databases live in a container volume; losing it without a tested backup loses financial records.
    category: operational
    likelihood: medium
    impact: high
    status: open
    owner: platform
    mitigation: WAL-G point-in-time recovery to S3, daily snapshots, monthly restore drills, and RDS before the pilot stores real money.
    components: [postgres]
    milestones: [m0-foundations]
    requirements: [backups]
    decisions: ["0001"]

  - id: webview-login-blocked
    title: Google or Facebook login is blocked in webviews
    description: Google refuses OAuth inside embedded webviews and Facebook restricts it, so users couldn't sign in on mobile.
    category: technical
    likelihood: high
    impact: high
    status: mitigating
    owner: platform
    mitigation: Sign in through the system browser and hand the session to the webview with a one-time code, tested in M0.
    components: [api, keycloak]
    milestones: [m0-foundations]

  - id: cross-development-leak
    title: Data leaks between developments
    description: A query that ignores the development would show one condominium's data to another, with loss of trust and legal exposure.
    category: security
    likelihood: medium
    impact: high
    status: open
    owner: core
    mitigation: Application grant checks plus Postgres row-level security, and isolation tests in CI.
    milestones: [m0-foundations]
    requirements: [tenant-isolation]

  - id: csd-custody
    title: Custody of fiscal certificates
    description: A leaked CSD lets someone issue fraudulent invoices in a development's name.
    category: security
    likelihood: low
    impact: high
    status: open
    owner: finance
    mitigation: Prefer a PAC that keeps certificates for many issuers; otherwise encrypt them with KMS. Audit every use.
    components: [invoicing]
    milestones: [m4-payments]

  - id: payment-aggregator
    title: Handling residents' money
    description: Holding residents' payments would make Habbyte a payment aggregator, with regulatory exposure.
    category: compliance
    likelihood: low
    impact: high
    status: open
    owner: finance
    mitigation: Payments go to each development's own Mercado Pago account, connected through OAuth.
    components: [payments]
    milestones: [m4-payments]

  - id: biometric-data
    title: Biometric data is sensitive personal data
    description: Biometrics are sensitive data under the LFPDPPP; storing templates, or enrolling without consent, is a legal exposure.
    category: compliance
    likelihood: low
    impact: high
    status: open
    owner: access
    mitigation: Templates stay on devices or with the vendor, and express consent is recorded before enrollment.
    components: [accesscontrol]
    requirements: [pii-declared]

  - id: keycloak-memory
    title: Keycloak's memory and upkeep
    description: Keycloak needs about 1.5 GB and regular upgrades, which could force a bigger host.
    category: operational
    likelihood: medium
    impact: low
    status: accepted
    owner: platform
    mitigation: An 8 GB host with a tuned heap; Zitadel is the fallback.
    components: [keycloak]
    requirements: [resource-limits]

  - id: keycloak-not-hardened
    title: Keycloak runs without container hardening
    description: The keycloak container has a writable root filesystem and keeps its Linux capabilities, unlike the backend and Caddy, so a compromise there has more room.
    category: security
    likelihood: low
    impact: medium
    status: open
    owner: platform
    mitigation: Only Caddy reaches it, and its admin console listens only on loopback. Drop capabilities and add no-new-privileges, then try a read-only filesystem with a tmpfs for its data.
    components: [keycloak]
    requirements: [least-privilege]
