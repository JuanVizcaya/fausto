version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/CMOT/habyta/backend/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: backend/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: backend/gen
    opt: paths=source_relative
inputs:
  - directory: proto
