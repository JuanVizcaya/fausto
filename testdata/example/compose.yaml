name: habbyte

# The MVP runtime: Caddy in front, one backend binary with every module,
# Keycloak, and Postgres holding the habbyte and keycloak databases. Only Caddy
# is published; Keycloak's admin console listens on a loopback port.

services:
  caddy:
    image: caddy:2.11.6-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      API_HOST: ${API_HOST:-api.localhost}
      AUTH_HOST: ${AUTH_HOST:-auth.localhost}
      # Caddy fails on an empty value, so keep the Caddyfile's default here.
      ACME_EMAIL: ${ACME_EMAIL:-admin@habbyte.localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the local CA; keep them to stay under Let's Encrypt
      # rate limits.
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The admin API listens only inside the container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      HABBYTE_DB_PASSWORD: ${HABBYTE_DB_PASSWORD:-habbyte}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres:/var/lib/postgresql
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habbyte"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_HTTP_ENABLED: "true"
      # Behind Caddy: the issuer is the public URL, and the admin console
      # answers only on the loopback port.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${AUTH_HOST:-auth.localhost}
      KC_HOSTNAME_ADMIN: http://localhost:9000
      # Health endpoints on the management port, which stays inside the
      # container.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:9000:8080"
    healthcheck:
      # The image has no curl or wget, so ask bash to speak HTTP.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M

  backend:
    build:
      context: ./backend
      args:
        SERVICE: habbyte
    # Not published: reachable only through Caddy.
    expose:
      - "8080"
    environment:
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: "10s" # keep below stop_grace_period
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # Runs the Go tests, including Postgres integration tests:
  #   docker compose --profile test run --rm --build test
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: development
    command: ["sh", "-c", "go vet ./... && go test -race -count=1 ./..."]
    environment:
      TEST_DATABASE_URL: "postgres://habbyte:${HABBYTE_DB_PASSWORD:-habbyte}@postgres:5432/habbyte_test?sslmode=disable"
    volumes:
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  postgres:
  go-mod:
  go-build:
