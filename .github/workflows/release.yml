# Tag vX.Y.Z to release: binaries on the GitHub release, the image at
# ghcr.io/juanvizcaya/fausto:vX.Y.Z, :vX and :latest, and the tag vX moved
# to it, for projects calling the check workflow at @vX.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Major version
        id: major
        run: echo "tag=${GITHUB_REF_NAME%%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/juanvizcaya/fausto:${{ github.ref_name }}
            ghcr.io/juanvizcaya/fausto:${{ steps.major.outputs.tag }}
            ghcr.io/juanvizcaya/fausto:latest
      - name: Move the major version tag
        run: |
          git tag -f "${{ steps.major.outputs.tag }}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${{ steps.major.outputs.tag }}"
