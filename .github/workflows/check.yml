# fausto's drift checks on the calling repository, for its CI. Opt in with
# one workflow file; delete it to disconnect:
#
#   name: fausto
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     check:
#       uses: JuanVizcaya/fausto/.github/workflows/check.yml@v0
#       # with:
#       #   checks: schema layers         # default: every check
#       #   working-directory: .          # where system/ is
#       #   version: v0.2.0               # a fausto release; default: the latest
#
# Without fausto's database here, the ownership and agents checks run only
# for charters kept in the repository.
#
# For a spec fausto keeps, fausto hands each pull request to a workflow on
# repository_dispatch (FAUSTO_PR_HANDOFF; see the README), which runs the
# project checks against the spec revision fausto checked, and reports a
# status of its own on the pull request's commit:
#
#   on:
#     repository_dispatch:
#       types: [fausto-spec]
#   jobs:
#     check:
#       uses: JuanVizcaya/fausto/.github/workflows/check.yml@v0
#       with:
#         ref: ${{ github.event.client_payload.head_sha }}
#         spec-ref: ${{ github.event.client_payload.spec_ref }}
#         commands: true
#     report:
#       needs: check
#       if: always()
#       runs-on: ubuntu-latest
#       permissions:
#         statuses: write
#       steps:
#         - env:
#             GH_TOKEN: ${{ github.token }}
#             SHA: ${{ github.event.client_payload.head_sha }}
#             RESULT: ${{ needs.check.result }}
#             URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
#           run: |
#             state=failure; [ "$RESULT" = success ] && state=success
#             gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" \
#               -f context=fausto/project-checks -f target_url="$URL" -f description="Project checks: $RESULT"
name: fausto check

on:
  workflow_call:
    inputs:
      version:
        description: A fausto release (vX.Y.Z), "latest", or a branch or commit of fausto to build.
        type: string
        default: latest
      checks:
        description: Space-separated checks to run; empty runs them all.
        type: string
        default: ""
      working-directory:
        description: The project's root in the repository, where system/ is.
        type: string
        default: "."
      commands-dir:
        description: Where the project's Go commands live, if not as in .fausto.yaml or backend/cmd.
        type: string
        default: ""
      compose-file:
        description: The project's Compose file, if not as in .fausto.yaml or compose.yaml.
        type: string
        default: ""
      proto-root:
        description: Where the project's protobuf packages live, if not as in .fausto.yaml or proto.
        type: string
        default: ""
      ref:
        description: The commit to check, such as a handed-off pull request's head; default, the event's.
        type: string
        default: ""
      spec-ref:
        description: A spec ref fausto handed off (refs/fausto/spec/rN); the spec is read from it instead of system/.
        type: string
        default: ""
      commands:
        description: Also run the project checks' commands (system/checks.yaml). They are the checked commit's code.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: fausto check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Fetch the spec fausto handed off
        if: ${{ inputs.spec-ref != '' }}
        env:
          SPEC_REF: ${{ inputs.spec-ref }}
        run: |
          set -euo pipefail
          [[ "$SPEC_REF" =~ ^refs/fausto/spec/r[0-9]+$ ]] || { echo "::error::not a fausto spec ref: $SPEC_REF"; exit 1; }
          git fetch --quiet --no-tags origin "+$SPEC_REF:$SPEC_REF"
          mkdir -p "$RUNNER_TEMP/spec"
          git archive "$SPEC_REF" | tar -x -C "$RUNNER_TEMP/spec"
      - name: Go, to build fausto from a branch or commit
        if: ${{ inputs.version != 'latest' && !startsWith(inputs.version, 'v') }}
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - name: Install fausto
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/fausto"
          mkdir -p "$dir"
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) arch="$(uname -m)" ;; esac
          if [ "$VERSION" = latest ] || [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            tag=()
            [ "$VERSION" = latest ] || tag=("$VERSION")
            gh release download "${tag[@]}" --repo JuanVizcaya/fausto --pattern "fausto_*_linux_${arch}.tar.gz" --dir "$dir"
            tar -xzf "$dir"/fausto_*_linux_"${arch}".tar.gz -C "$dir" fausto
          else
            # A branch or commit of fausto: build it from a clone.
            git clone --quiet --filter=blob:none https://github.com/JuanVizcaya/fausto.git "$RUNNER_TEMP/fausto-src"
            git -C "$RUNNER_TEMP/fausto-src" checkout --quiet "$VERSION"
            (cd "$RUNNER_TEMP/fausto-src" && go build -trimpath -o "$dir/fausto" ./cmd/fausto)
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: Check the code against system/
        working-directory: ${{ inputs.working-directory }}
        env:
          CHECKS: ${{ inputs.checks }}
          SPEC_REF: ${{ inputs.spec-ref }}
          COMMANDS: ${{ inputs.commands }}
          COMMANDS_DIR: ${{ inputs.commands-dir }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          PROTO_ROOT: ${{ inputs.proto-root }}
        run: |
          set -euo pipefail
          fausto version
          flags=(-github)
          [ -z "$SPEC_REF" ] || flags+=(-spec-from "$RUNNER_TEMP/spec")
          [ "$COMMANDS" != true ] || flags+=(-commands)
          [ -z "$COMMANDS_DIR" ] || flags+=(-commands-dir "$COMMANDS_DIR")
          [ -z "$COMPOSE_FILE" ] || flags+=(-compose-file "$COMPOSE_FILE")
          [ -z "$PROTO_ROOT" ] || flags+=(-proto-root "$PROTO_ROOT")
          # shellcheck disable=SC2086 # CHECKS is a list of names
          fausto check "${flags[@]}" $CHECKS
